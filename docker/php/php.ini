; Configuración SOLO para desarrollo local. En producción (cPanel) los
; errores no deben mostrarse en pantalla.
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On

; La Carga Masiva de Personal sube archivos Excel; los límites por defecto
; de PHP (2M) se quedan cortos.
upload_max_filesize = 20M
post_max_size = 25M
max_execution_time = 300

date.timezone = America/Guayaquil

; ── Xdebug ───────────────────────────────────────────────────────────────
; start_with_request=trigger: solo depura si la petición trae XDEBUG_TRIGGER
; (la extensión de navegador "Xdebug helper" lo añade con un clic).
; Poner "yes" para depurar TODAS las peticiones.
xdebug.mode = debug
xdebug.start_with_request = trigger
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.idekey = VSCODE
